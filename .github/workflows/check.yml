name: Package

on: [push, pull_request]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: make check test
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: behavior-review
          path: dist/
